<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corrado HIIT Timer</title><style>body{margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif}*{box-sizing:border-box}.app{max-width:760px;margin:auto;padding:16px}.green{color:#39ff14}.card{border:1px solid #292929;border-radius:22px;background:#070707;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:11px;font-weight:900;text-transform:uppercase;color:#bbb}input{width:100%;margin-top:5px;padding:12px;background:#000;color:#fff;border:1px solid #444;border-radius:11px;font-size:16px}button{min-height:48px;border-radius:13px;font-weight:900;border:0;cursor:pointer}.start{background:#39ff14;color:#000;padding:0 22px}.ghost{background:#111;color:#fff;border:1px solid #444}.end{background:#fff;color:#000}.hidden{display:none}.hero{text-align:center;padding:18px 0 4px}.phase{font-weight:950;text-transform:uppercase;letter-spacing:.16em;color:#39ff14}.clock{font-size:clamp(66px,23vw,130px);font-weight:1000;line-height:.95;letter-spacing:-.07em;font-variant-numeric:tabular-nums}.speed{font-size:24px;font-weight:900;margin-top:10px}.bar{height:13px;background:#252525;border-radius:999px;overflow:hidden;margin-top:22px}.bar span{display:block;height:100%;background:#39ff14;width:0}.upnext{display:flex;align-items:center;gap:7px;overflow-x:auto;margin-top:16px;white-space:nowrap}.upevents{display:flex;flex-wrap:nowrap;gap:7px;min-width:max-content}.chip{flex:none;border:1px solid #333;background:#0c0c0c;border-radius:999px;padding:7px 10px;font-size:12px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}.setupActions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}.toggle{display:flex;gap:9px;align-items:center;text-transform:none;font-size:14px;color:#fff}.toggle input{width:20px;margin:0;accent-color:#39ff14}@media(max-width:480px){.app{padding:12px}.card{padding:14px}.setupActions{flex-direction:column;align-items:stretch}.start{width:100%}}</style></head><body><main class="app"><div class="green" style="font-size:11px;font-weight:950;letter-spacing:.2em">HIIT TRAINER</div><h1>Corrado HIIT Timer</h1><section id="setup" class="card"><div class="grid"><label>Warm Up min<input id="warm" type="number" min="0" step=".5" value="5"></label><label>Warm Up speed<input id="warmSp" type="number" min="0" step=".1" value="3.5"></label><label>High Intensity min<input id="high" type="number" min=".1" step=".1" value="1"></label><label>High Intensity speed<input id="highSp" type="number" min="0" step=".1" value="7.5"></label><label>Low Intensity min<input id="low" type="number" min="0" step=".1" value="1"></label><label>Low Intensity speed<input id="lowSp" type="number" min="0" step=".1" value="3"></label><label>Intervals<input id="count" type="number" min="1" max="100" value="6"></label><label>Cool Down min<input id="cool" type="number" min="0" step=".5" value="5"></label><label>Cool Down speed<input id="coolSp" type="number" min="0" step=".1" value="3"></label><label>Speed unit<input id="unit" type="text" value="mph"></label></div><div class="setupActions"><label class="toggle"><input id="bellOn" type="checkbox" checked>Loud bell 10 sec before transition</label><button id="start" class="start">START WORKOUT</button></div><div id="msg" class="green"></div></section><section id="run" class="card hidden"><div class="hero"><div id="phase" class="phase"></div><div id="clock" class="clock">00:00</div><div id="speed" class="speed"></div></div><div class="bar"><span id="progress"></span></div><div class="upnext"><strong class="green" style="font-size:11px">UP NEXT</strong><div id="upcoming" class="upevents"></div></div><div class="actions"><button id="pause" class="ghost">PAUSE</button><button id="skip" class="ghost">SKIP</button><button id="end" class="end">END</button></div></section></main><script>(()=>{const $=s=>document.querySelector(s);let steps=[],idx=0,left=0,timer,running=false,warned=false,audio;const val=(id,min,max=999)=>Math.min(max,Math.max(min,Number($(id).value)||0));const fmt=x=>{x=Math.max(0,Math.ceil(x));return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')};function bell(){try{const C=AudioContext||webkitAudioContext;if(!audio)audio=new C();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;[0,.3,.6].forEach((d,k)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=k===1?1200:980;g.gain.setValueAtTime(.001,now+d);g.gain.exponentialRampToValueAtTime(.9,now+d+.02);g.gain.exponentialRampToValueAtTime(.001,now+d+.42);o.connect(g);g.connect(audio.destination);o.start(now+d);o.stop(now+d+.45)})}catch(e){}}function build(){steps=[];const u=$('#unit').value.trim()||'mph',c=Math.round(val('#count',1,100));let d=val('#warm',0)*60;if(d)steps.push({name:'Warm Up',d:Math.round(d),speed:val('#warmSp',0),u});for(let x=1;x<=c;x++){steps.push({name:'High Intensity '+x,d:Math.max(1,Math.round(val('#high',.1)*60)),speed:val('#highSp',0),u});if(x<c&&(d=val('#low',0)*60))steps.push({name:'Low Intensity '+x,d:Math.round(d),speed:val('#lowSp',0),u})}d=val('#cool',0)*60;if(d)steps.push({name:'Cool Down',d:Math.round(d),speed:val('#coolSp',0),u});return steps.length}function paint(){const s=steps[idx];if(!s)return;$('#phase').textContent=s.name;$('#clock').textContent=fmt(left);$('#speed').textContent=s.speed+' '+s.u;$('#progress').style.width=Math.min(100,Math.max(0,(s.d-left)/s.d*100))+'%';const up=steps.slice(idx+1,idx+4);$('#upcoming').innerHTML=up.length?up.map(x=>'<span class="chip">'+x.name+' · '+fmt(x.d)+' · '+x.speed+' '+x.u+'</span>').join(''):'<span class="chip">Finish</span>'}function next(){idx++;if(idx>=steps.length){clearInterval(timer);running=false;$('#phase').textContent='COMPLETE';$('#clock').textContent='DONE';$('#speed').textContent='Great work';$('#progress').style.width='100%';$('#upcoming').innerHTML='<span class="chip">Workout complete</span>';return}left=steps[idx].d;warned=false;paint()}function tick(){if(!running)return;left--;if($('#bellOn').checked&&left===10&&!warned){warned=true;bell()}if(left<=0){bell();next()}else paint()}$('#start').onclick=()=>{if(!build()){ $('#msg').textContent='Enter a valid workout.';return}idx=0;left=steps[0].d;running=true;warned=false;$('#setup').classList.add('hidden');$('#run').classList.remove('hidden');paint();bell();clearInterval(timer);timer=setInterval(tick,1000)};$('#pause').onclick=()=>{running=!running;$('#pause').textContent=running?'PAUSE':'RESUME'};$('#skip').onclick=next;$('#end').onclick=()=>{clearInterval(timer);running=false;$('#run').classList.add('hidden');$('#setup').classList.remove('hidden')}})();</script></body></html>
