<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HIIT Gym Timer</title>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            iosBg: '#000000',
            iosCard: '#1c1c1e',
            iosCardBorder: '#2c2c2e',
            iosBlue: '#0A84FF',
            iosGreen: '#30D158',
            iosOrange: '#FF9F0A',
            iosRed: '#FF453A',
            iosPurple: '#BF5AF2',
            iosGray: '#8E8E93',
            iosDarkGray: '#3A3A3C',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Helvetica Neue', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* Hide scrollbars for clean compact mobile layout */
    ::-webkit-scrollbar {
      display: none;
    }
    * {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-black text-white antialiased selection:bg-iosBlue selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // Web Audio API Synthesizer for workout cues
    class SoundEffects {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      beep(freq = 600, type = 'sine', duration = 0.15, vol = 0.3) {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          console.error(e);
        }
      }
      shortBeep() { this.beep(750, 'sine', 0.1, 0.25); }
      highBeep() { this.beep(1200, 'triangle', 0.3, 0.4); }
      finishChime() {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          setTimeout(() => this.beep(freq, 'sine', 0.3, 0.3), idx * 120);
        });
      }
    }

    const soundFX = new SoundEffects();

    function App() {
      // Screen states: 'setup', 'active', 'summary'
      const [screen, setScreen] = useState('setup');

      // Setup state defaults
      const [warmupMin, setWarmupMin] = useState(6);
      const [warmupSec, setWarmupSec] = useState(0);
      const [warmupSpeed, setWarmupSpeed] = useState(3.5);

      const [highMin, setHighMin] = useState(1);
      const [highSec, setHighSec] = useState(0);
      const [highSpeed, setHighSpeed] = useState(6.5);

      const [lowMin, setLowMin] = useState(1);
      const [lowSec, setLowSec] = useState(0);
      const [lowSpeed, setLowSpeed] = useState(3.5);

      const [cooldownMin, setCooldownMin] = useState(3);
      const [cooldownSec, setCooldownSec] = useState(0);
      const [cooldownSpeed, setCooldownSpeed] = useState(3.0);

      const [cycles, setCycles] = useState(6);

      // Workout execution state
      const [timeline, setTimeline] = useState([]);
      const [currentIdx, setCurrentIdx] = useState(0);
      const [secondsLeft, setSecondsLeft] = useState(0);
      const [isPaused, setIsPaused] = useState(false);
      const [totalElapsedSec, setTotalElapsedSec] = useState(0);

      // Workout record for summary
      const [completedWorkout, setCompletedWorkout] = useState(null);

      // Construct timeline from settings
      const buildTimeline = () => {
        const list = [];
        const wSec = warmupMin * 60 + warmupSec;
        if (wSec > 0) {
          list.push({ type: 'Warmup', duration: wSec, speed: warmupSpeed, color: '#30D158', badgeBg: 'bg-iosGreen/20 text-iosGreen' });
        }
        const hSec = highMin * 60 + highSec;
        const lSec = lowMin * 60 + lowSec;
        for (let i = 1; i <= cycles; i++) {
          if (hSec > 0) {
            list.push({ type: `High (${i}/${cycles})`, duration: hSec, speed: highSpeed, color: '#FF453A', badgeBg: 'bg-iosRed/20 text-iosRed' });
          }
          if (lSec > 0) {
            list.push({ type: `Low (${i}/${cycles})`, duration: lSec, speed: lowSpeed, color: '#FF9F0A', badgeBg: 'bg-iosOrange/20 text-iosOrange' });
          }
        }
        const cSec = cooldownMin * 60 + cooldownSec;
        if (cSec > 0) {
          list.push({ type: 'Cooldown', duration: cSec, speed: cooldownSpeed, color: '#0A84FF', badgeBg: 'bg-iosBlue/20 text-iosBlue' });
        }
        return list;
      };

      const startWorkout = () => {
        soundFX.init();
        soundFX.highBeep();
        const built = buildTimeline();
        if (built.length === 0) return;
        setTimeline(built);
        setCurrentIdx(0);
        setSecondsLeft(built[0].duration);
        setTotalElapsedSec(0);
        setIsPaused(false);
        setScreen('active');
      };

      // Main Timer Loop
      useEffect(() => {
        if (screen !== 'active' || isPaused) return;

        const interval = setInterval(() => {
          setTotalElapsedSec(prev => prev + 1);

          setSecondsLeft(prev => {
            if (prev <= 4 && prev > 1) {
              soundFX.shortBeep();
            }

            if (prev <= 1) {
              // Move to next interval or end
              if (currentIdx + 1 < timeline.length) {
                soundFX.highBeep();
                const nextItem = timeline[currentIdx + 1];
                setCurrentIdx(currentIdx + 1);
                return nextItem.duration;
              } else {
                // Workout Finished
                finishWorkout();
                return 0;
              }
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(interval);
      }, [screen, isPaused, currentIdx, timeline]);

      const skipInterval = () => {
        soundFX.highBeep();
        if (currentIdx + 1 < timeline.length) {
          const nextItem = timeline[currentIdx + 1];
          setCurrentIdx(currentIdx + 1);
          setSecondsLeft(nextItem.duration);
        } else {
          finishWorkout();
        }
      };

      const finishWorkout = () => {
        soundFX.finishChime();
        // Calculate statistics based on elapsed timeline up to current point
        let elapsed = totalElapsedSec;
        if (elapsed === 0) {
          // If ended immediately, approximate from total duration
          elapsed = 1;
        }

        // Calculate actual timeline segments completed up to current index & remaining seconds
        let distanceMiles = 0;
        let accruedSeconds = 0;

        for (let i = 0; i <= currentIdx && i < timeline.length; i++) {
          const seg = timeline[i];
          let segSecondsSpent = seg.duration;
          if (i === currentIdx) {
            segSecondsSpent = seg.duration - secondsLeft;
          }
          if (segSecondsSpent > 0) {
            accruedSeconds += segSecondsSpent;
            distanceMiles += (seg.speed * (segSecondsSpent / 3600));
          }
        }

        const actualDurationSec = accruedSeconds > 0 ? accruedSeconds : totalElapsedSec;
        const avgSpeed = actualDurationSec > 0 ? (distanceMiles / (actualDurationSec / 3600)) : 0;

        // Calorie Calculation Formula:
        // Weight: 155 lbs (70.3 kg), Male, 43 years old, 5'7" (170 cm)
        // MET estimation based on treadmill speed (mph):
        // 3.0-3.5 mph ~ 3.5-4.3 METs
        // 6.5 mph ~ 10.0 METs
        // Calories = MET * 3.5 * weight_kg / 200 * duration_minutes
        let totalCalories = 0;
        for (let i = 0; i <= currentIdx && i < timeline.length; i++) {
          const seg = timeline[i];
          let segSec = (i === currentIdx) ? (seg.duration - secondsLeft) : seg.duration;
          if (segSec > 0) {
            let met = 3.5;
            if (seg.speed >= 6.5) met = 10.2;
            else if (seg.speed >= 5.0) met = 8.0;
            else if (seg.speed >= 3.5) met = 4.3;
            else met = 3.3;

            // Cal/min = MET * 3.5 * 70.3 / 200 = MET * 1.23
            const calPerMin = met * 1.23;
            totalCalories += (calPerMin * (segSec / 60));
          }
        }

        setCompletedWorkout({
          totalTimeSec: actualDurationSec,
          avgSpeed: avgSpeed,
          calories: Math.round(totalCalories),
          timeline: timeline.slice(0, currentIdx + 1),
          currentIdx,
          secondsLeftInCurrent: secondsLeft
        });

        setScreen('summary');
      };

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      // ----------------------------------------------------
      // SCREEN 1: SETUP SCREEN
      // ----------------------------------------------------
      if (screen === 'setup') {
        const totalDurationSec = (warmupMin * 60 + warmupSec) +
          (cycles * ((highMin * 60 + highSec) + (lowMin * 60 + lowSec))) +
          (cooldownMin * 60 + cooldownSec);

        return (
          <div className="flex flex-col h-screen max-w-md mx-auto p-4 justify-between select-none">
            {/* Header */}
            <div className="text-center pt-2 pb-1">
              <h1 className="text-2xl font-bold tracking-tight text-white">HIIT Gym Timer</h1>
              <p className="text-xs text-iosGray font-medium mt-0.5">Mobile-optimized treadmill workout builder</p>
            </div>

            {/* Input Cards Container */}
            <div className="flex-1 overflow-y-auto space-y-2.5 my-2 pr-1">
              
              {/* Warmup */}
              <div className="bg-iosCard border border-iosCardBorder rounded-2xl p-3 shadow-lg">
                <div className="flex items-center justify-between mb-2">
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-iosGreen inline-block"></span>
                    <span className="font-semibold text-sm text-white">Warmup</span>
                  </div>
                  <span className="text-xs font-mono text-iosGreen font-semibold bg-iosGreen/10 px-2 py-0.5 rounded-full">
                    {warmupMin}m {warmupSec > 0 ? `${warmupSec}s` : ''} @ {warmupSpeed} mph
                  </span>
                </div>
                <div className="grid grid-cols-2 gap-2 text-xs">
                  <div>
                    <label className="text-iosGray block mb-1 text-[11px]">Duration (min)</label>
                    <div className="flex items-center bg-black/60 rounded-xl border border-iosCardBorder overflow-hidden">
                      <button onClick={() => setWarmupMin(Math.max(0, warmupMin - 1))} className="px-3 py-1.5 bg-iosDarkGray text-white font-bold active:bg-iosGray/40">-</button>
                      <input type="number" min="0" max="60" value={warmupMin} onChange={e => setWarmupMin(Number(e.target.value))} className="w-full bg-transparent text-center font-bold text-sm text-white focus:outline-none" />
                      <button onClick={() => setWarmupMin(warmupMin + 1)} className="px-3 py-1.5 bg-iosDarkGray text-white font-bold active:bg-iosGray/40">+</button>
                    </div>
                  </div>
                  <div>
                    <label className="text-iosGray block mb-1 text-[11px]">Speed (mph)</label>
                    <div className="flex items-center bg-black/60 rounded-xl border border-iosCardBorder overflow-hidden">
                      <button onClick={() => setWarmupSpeed(Math.max(0.5, +(warmupSpeed - 0.5).toFixed(1)))} className="px-3 py-1.5 bg-iosDarkGray text-white font-bold active:bg-iosGray/40">-</button>
                      <input type="number" step="0.1" min="0.5" max="15" value={warmupSpeed} onChange={e => setWarmupSpeed(Number(e.target.value))} className="w-full bg-transparent text-center font-bold text-sm text-white focus:outline-none" />
                      <button onClick={() => setWarmupSpeed(+(warmupSpeed + 0.5).toFixed(1))} className="px-3 py-1.5 bg-iosDarkGray text-white font-bold active:bg-iosGray/40">+</button>
                    </div>
                  </div>
                </div>
              </div>

              {/* High Intensity */}
              <div className="bg-iosCard border border-iosCardBorder rounded-2xl p-3 shadow-lg">
                <div className="flex items-center justify-between mb-2">
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-iosRed inline-block"></span>
                    <span className="font-semibold text-sm text-white">High-Intensity Interval</span>
                  </div>
                  <span className="text-xs font-mono text-iosRed font-semibold bg-iosRed/10 px-2 py-0.5 rounded-full">
                    {highMin}m @ {highSpeed} mph
                  </span>
                </div>
                <div className="grid grid-cols-2 gap-2 text-xs">
                  <div>
                    <label className="text-iosGray block mb-1 text-[11px]">Duration (min)</label>
                    <div className="flex items-center bg-black/60 rounded-xl border border-iosCardBorder overflow-hidden">
                      <button onClick={() => setHighMin(Math.max(0, highMin - 1))} className="px-3 py-1.5 bg-iosDarkGray text-white font-bold active:bg-iosGray/40">-</button>
                      <input type="number" min="0" max="60" value={highMin} onChange={e => setHighMin(Number(e.target.value))} className="w-full bg-transparent text-center font-bold text-sm text-white focus:outline-none" />
                      <button onClick={() => setHighMin(highMin + 1)} className="px-3 py-1.5 bg-iosDarkGray text-white font-bold active:bg-iosGray/40">+</button>
                    </div>
                  </div>
                  <div>
                    <label className="text-iosGray block mb-1 text-[11px]">Speed (mph)</label>
                    <div className="flex items-center bg-black/60 rounded-xl border border-iosCardBorder overflow-hidden">
                      <button onClick={() => setHighSpeed(Math.max(0.5, +(highSpeed - 0.5).toFixed(1)))} className="px-3 py-1.5 bg-iosDarkGray text-white font-bold active:bg-iosGray/40">-</button>
                      <input type="number" step="0.1" min="0.5" max="15" value={highSpeed} onChange={e => setHighSpeed(Number(e.target.value))} className="w-full bg-transparent text-center font-bold text-sm text-white focus:outline-none" />
                      <button onClick={() => setHighSpeed(+(highSpeed + 0.5).toFixed(1))} className="px-3 py-1.5 bg-iosDarkGray text-white font-bold active:bg-iosGray/40">+</button>
                    </div>
                  </div>
                </div>
              </div>

              {/* Low Intensity */}
              <div className="bg-iosCard border border-iosCardBorder rounded-2xl p-3 shadow-lg">
                <div className="flex items-center justify-between mb-2">
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-iosOrange inline-block"></span>
                    <span className="font-semibold text-sm text-white">Low-Intensity Interval</span>
                  </div>
                  <span className="text-xs font-mono text-iosOrange font-semibold bg-iosOrange/10 px-2 py-0.5 rounded-full">
                    {lowMin}m @ {lowSpeed} mph
                  </span>
                </div>
                <div className="grid grid-cols-2 gap-2 text-xs">
                  <div>
                    <label className="text-iosGray block mb-1 text-[11px]">Duration (min)</label>
                    <div className="flex items-center bg-black/60 rounded-xl border border-iosCardBorder overflow-hidden">
                      <button onClick={() => setLowMin(Math.max(0, lowMin - 1))} className="px-3 py-1.5 bg-iosDarkGray text-white font-bold active:bg-iosGray/40">-</button>
                      <input type="number" min="0" max="60" value={lowMin} onChange={e => setLowMin(Number(e.target.value))} className="w-full bg-transparent text-center font-bold text-sm text-white focus:outline-none" />
                      <button onClick={() => setLowMin(lowMin + 1)} className="px-3 py-1.5 bg-iosDarkGray text-white font-bold active:bg-iosGray/40">+</button>
                    </div>
                  </div>
                  <div>
                    <label className="text-iosGray block mb-1 text-[11px]">Speed (mph)</label>
                    <div className="flex items-center bg-black/60 rounded-xl border border-iosCardBorder overflow-hidden">
                      <button onClick={() => setLowSpeed(Math.max(0.5, +(lowSpeed - 0.5).toFixed(1)))} className="px-3 py-1.5 bg-iosDarkGray text-white font-bold active:bg-iosGray/40">-</button>
                      <input type="number" step="0.1" min="0.5" max="15" value={lowSpeed} onChange={e => setLowSpeed(Number(e.target.value))} className="w-full bg-transparent text-center font-bold text-sm text-white focus:outline-none" />
                      <button onClick={() => setLowSpeed(+(lowSpeed + 0.5).toFixed(1))} className="px-3 py-1.5 bg-iosDarkGray text-white font-bold active:bg-iosGray/40">+</button>
                    </div>
                  </div>
                </div>
              </div>

              {/* Repeat Cycles & Cooldown */}
              <div className="grid grid-cols-2 gap-2">
                <div className="bg-iosCard border border-iosCardBorder rounded-2xl p-3 shadow-lg">
                  <label className="text-iosGray block mb-1 text-[11px] font-semibold">Interval Cycles</label>
                  <div className="flex items-center bg-black/60 rounded-xl border border-iosCardBorder overflow-hidden">
                    <button onClick={() => setCycles(Math.max(1, cycles - 1))} className="px-3 py-1.5 bg-iosDarkGray text-white font-bold active:bg-iosGray/40">-</button>
                    <span className="w-full text-center font-bold text-sm text-white">{cycles}x</span>
                    <button onClick={() => setCycles(cycles + 1)} className="px-3 py-1.5 bg-iosDarkGray text-white font-bold active:bg-iosGray/40">+</button>
                  </div>
                </div>

                <div className="bg-iosCard border border-iosCardBorder rounded-2xl p-3 shadow-lg">
                  <div className="flex items-center justify-between mb-1">
                    <label className="text-iosGray text-[11px] font-semibold">Cooldown</label>
                    <span className="text-[10px] font-mono text-iosBlue font-semibold">{cooldownSpeed} mph</span>
                  </div>
                  <div className="flex items-center bg-black/60 rounded-xl border border-iosCardBorder overflow-hidden">
                    <button onClick={() => setCooldownMin(Math.max(0, cooldownMin - 1))} className="px-2.5 py-1.5 bg-iosDarkGray text-white font-bold active:bg-iosGray/40">-</button>
                    <span className="w-full text-center font-bold text-sm text-white">{cooldownMin}m</span>
                    <button onClick={() => setCooldownMin(cooldownMin + 1)} className="px-2.5 py-1.5 bg-iosDarkGray text-white font-bold active:bg-iosGray/40">+</button>
                  </div>
                </div>
              </div>

            </div>

            {/* Total summary info & Start Button */}
            <div className="pt-2">
              <div className="flex justify-between items-center px-1 mb-2 text-xs text-iosGray">
                <span>Total Duration: <strong className="text-white font-mono">{Math.floor(totalDurationSec / 60)} min {totalDurationSec % 60}s</strong></span>
                <span>Intervals: <strong className="text-white">{cycles * 2} phases</strong></span>
              </div>
              <button
                onClick={startWorkout}
                className="w-full bg-iosBlue hover:bg-blue-600 active:scale-[0.98] transition text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-iosBlue/25 text-base flex items-center justify-center gap-2"
              >
                <span>Start Workout</span>
                <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </button>
            </div>
          </div>
        );
      }

      // ----------------------------------------------------
      // SCREEN 2: ACTIVE WORKOUT TIMER (Dark Apple Style)
      // ----------------------------------------------------
      if (screen === 'active') {
        const currentEvent = timeline[currentIdx] || {};
        const progress = currentEvent.duration ? (currentEvent.duration - secondsLeft) / currentEvent.duration : 0;
        const dashoffset = 565.48 * (1 - progress); // 2 * PI * r (r=90)

        // Upcoming events line (showing next 3 items, no scroll)
        const upcomingEvents = timeline.slice(currentIdx + 1, currentIdx + 4);

        return (
          <div className="flex flex-col h-screen max-w-md mx-auto p-4 justify-between select-none">
            {/* Top Bar: Progress & Status */}
            <div className="flex items-center justify-between pt-1">
              <span className="text-xs font-semibold text-iosGray uppercase tracking-wider">
                Interval {currentIdx + 1} of {timeline.length}
              </span>
              <span className="text-xs font-mono font-medium text-iosGray bg-iosCard px-2.5 py-1 rounded-full border border-iosCardBorder">
                Elapsed: {formatTime(totalElapsedSec)}
              </span>
            </div>

            {/* Central Visual Ring Timer */}
            <div className="flex flex-col items-center justify-center my-auto">
              <div className="relative w-64 h-64 flex items-center justify-center">
                {/* SVG Ring */}
                <svg className="w-full h-full -rotate-90 transform" viewBox="0 0 200 200">
                  <circle
                    cx="100" cy="100" r="90"
                    stroke="#1c1c1e" strokeWidth="12"
                    fill="transparent"
                  />
                  <circle
                    cx="100" cy="100" r="90"
                    stroke={currentEvent.color || '#30D158'}
                    strokeWidth="12"
                    strokeDasharray="565.48"
                    strokeDashoffset={dashoffset}
                    strokeLinecap="round"
                    fill="transparent"
                    className="transition-all duration-1000 ease-linear"
                  />
                </svg>

                {/* Inner Content */}
                <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
                  <span className={`text-xs font-extrabold uppercase tracking-widest px-3 py-1 rounded-full ${currentEvent.badgeBg}`}>
                    {currentEvent.type}
                  </span>
                  
                  <div className="text-6xl font-extrabold font-mono tracking-tighter my-1 text-white">
                    {formatTime(secondsLeft)}
                  </div>

                  <div className="flex items-center gap-1 text-lg font-bold text-white/90">
                    <span className="text-2xl">{currentEvent.speed}</span>
                    <span className="text-xs text-iosGray font-semibold uppercase">MPH</span>
                  </div>
                </div>
              </div>
            </div>

            {/* Bottom Controls & Upcoming Items */}
            <div className="space-y-4 pb-2">
              
              {/* Upcoming Items Single-Line Badge Preview (No Scroll) */}
              <div className="bg-iosCard border border-iosCardBorder rounded-xl p-2.5">
                <div className="text-[10px] font-bold text-iosGray uppercase tracking-wider mb-1.5 px-0.5">
                  Up Next
                </div>
                <div className="flex items-center gap-1.5 overflow-hidden">
                  {upcomingEvents.length > 0 ? (
                    upcomingEvents.map((item, idx) => (
                      <div
                        key={idx}
                        className={`flex-1 flex items-center justify-between px-2 py-1.5 rounded-lg border border-white/5 bg-black/40 text-[11px] font-medium truncate`}
                      >
                        <span className="truncate font-semibold text-white/90">{item.type}</span>
                        <span className="font-mono text-iosGray shrink-0 ml-1">{item.speed}mph</span>
                      </div>
                    ))
                  ) : (
                    <div className="text-xs text-iosGray text-center w-full py-1 font-medium">Final interval — Push to the finish!</div>
                  )}
                </div>
              </div>

              {/* Action Buttons: Pause, Skip, End */}
              <div className="grid grid-cols-3 gap-2.5">
                <button
                  onClick={() => setIsPaused(!isPaused)}
                  className={`py-3.5 rounded-2xl font-bold text-sm flex items-center justify-center gap-1.5 transition active:scale-95 ${
                    isPaused ? 'bg-iosGreen text-black' : 'bg-iosDarkGray text-white border border-iosCardBorder'
                  }`}
                >
                  {isPaused ? (
                    <>
                      <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                      <span>Resume</span>
                    </>
                  ) : (
                    <>
                      <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                      <span>Pause</span>
                    </>
                  )}
                </button>

                <button
                  onClick={skipInterval}
                  className="py-3.5 bg-iosDarkGray border border-iosCardBorder text-white rounded-2xl font-bold text-sm flex items-center justify-center gap-1.5 active:scale-95 transition"
                >
                  <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                  <span>Skip</span>
                </button>

                <button
                  onClick={finishWorkout}
                  className="py-3.5 bg-iosRed/20 border border-iosRed/40 text-iosRed rounded-2xl font-bold text-sm flex items-center justify-center gap-1.5 active:scale-95 transition"
                >
                  <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
                  <span>END</span>
                </button>
              </div>

            </div>
          </div>
        );
      }

      // ----------------------------------------------------
      // SCREEN 3: WORKOUT SUMMARY SCREEN
      // ----------------------------------------------------
      if (screen === 'summary' && completedWorkout) {
        const { totalTimeSec, avgSpeed, calories, timeline: doneTimeline } = completedWorkout;

        // Peak speed calculation
        const peakSpeed = Math.max(...doneTimeline.map(t => t.speed), 1);

        return (
          <div className="flex flex-col h-screen max-w-md mx-auto p-4 justify-between select-none">
            
            {/* Header */}
            <div className="text-center pt-2">
              <div className="inline-flex items-center justify-center w-12 h-12 rounded-full bg-iosGreen/20 text-iosGreen mb-2">
                <svg className="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
              </div>
              <h1 className="text-2xl font-extrabold text-white tracking-tight">Workout Summary</h1>
              <p className="text-xs text-iosGray">Great job! Here is your performance overview.</p>
            </div>

            {/* Key Metrics Cards Grid */}
            <div className="grid grid-cols-3 gap-2.5 my-3">
              
              <div className="bg-iosCard border border-iosCardBorder rounded-2xl p-3 flex flex-col items-center justify-center text-center">
                <span className="text-[10px] font-bold text-iosGray uppercase tracking-wider mb-1">TOTAL TIME</span>
                <span className="text-lg font-extrabold font-mono text-white">{formatTime(totalTimeSec)}</span>
              </div>

              <div className="bg-iosCard border border-iosCardBorder rounded-2xl p-3 flex flex-col items-center justify-center text-center">
                <span className="text-[10px] font-bold text-iosGray uppercase tracking-wider mb-1">AVG SPEED</span>
                <div className="flex items-baseline gap-0.5">
                  <span className="text-lg font-extrabold font-mono text-iosGreen">{avgSpeed.toFixed(1)}</span>
                  <span className="text-[10px] text-iosGray">mph</span>
                </div>
              </div>

              <div className="bg-iosCard border border-iosCardBorder rounded-2xl p-3 flex flex-col items-center justify-center text-center">
                <span className="text-[10px] font-bold text-iosGray uppercase tracking-wider mb-1">CALORIES</span>
                <div className="flex items-baseline gap-0.5">
                  <span className="text-lg font-extrabold font-mono text-iosOrange">{calories}</span>
                  <span className="text-[10px] text-iosGray">kcal</span>
                </div>
              </div>

            </div>

            {/* Profile Context Note */}
            <div className="bg-iosCard/50 border border-iosCardBorder/60 rounded-xl px-3 py-2 text-[11px] text-iosGray flex items-center justify-between">
              <span>Calorie estimate model:</span>
              <span className="text-white font-medium">Male • 5'7" • 155 lbs • 43 yrs</span>
            </div>

            {/* Simple Speed vs Time Graph */}
            <div className="bg-iosCard border border-iosCardBorder rounded-2xl p-3 flex-1 flex flex-col justify-between my-2">
              <div className="flex justify-between items-center mb-2">
                <span className="text-xs font-bold text-white">Speed Profile Over Time</span>
                <span className="text-[10px] font-mono text-iosGray">Max: {peakSpeed} mph</span>
              </div>

              {/* Bar Chart Container */}
              <div className="flex-1 flex items-end gap-1.5 pt-4 pb-1 border-b border-iosDarkGray px-1 min-h-[120px]">
                {doneTimeline.map((item, idx) => {
                  const heightPct = Math.round((item.speed / peakSpeed) * 100);
                  return (
                    <div key={idx} className="flex-1 flex flex-col items-center h-full justify-end group">
                      <div
                        style={{ height: `${heightPct}%`, backgroundColor: item.color }}
                        className="w-full rounded-t-sm transition-all duration-300 opacity-90 group-hover:opacity-100 min-h-[4px]"
                      ></div>
                    </div>
                  );
                })}
              </div>

              {/* Chart Legend */}
              <div className="flex justify-between items-center text-[10px] text-iosGray pt-2">
                <span>Start</span>
                <div className="flex gap-3">
                  <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-iosGreen"></span>Warmup</span>
                  <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-iosRed"></span>High</span>
                  <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-iosOrange"></span>Low</span>
                  <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-iosBlue"></span>Cool</span>
                </div>
                <span>End</span>
              </div>
            </div>

            {/* Done Button */}
            <button
              onClick={() => setScreen('setup')}
              className="w-full bg-iosBlue hover:bg-blue-600 active:scale-[0.98] transition text-white font-bold py-3.5 rounded-2xl text-base shadow-lg shadow-iosBlue/25 mt-1"
            >
              Done / New Workout
            </button>

          </div>
        );
      }

      return null;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
